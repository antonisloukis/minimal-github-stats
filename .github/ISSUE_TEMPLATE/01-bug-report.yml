name: Bug report
description: Report a reproducible problem with the generator, workflow, configuration, or SVG output.
title: "[Bug]: "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.

        Please search existing issues before submitting a new report. Never include GitHub tokens or other secrets.

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of Minimal GitHub Stats is affected?
      options:
        - GitHub Actions workflow
        - Statistics collection
        - Language statistics
        - Contribution streaks
        - SVG layout or appearance
        - Configuration
        - Documentation
        - Local execution
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Clearly describe what went wrong.
      placeholder: Explain the problem and when it happens.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Create a repository from the template
        2. Change ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: Describe the actual result.
    validations:
      required: true

  - type: textarea
    id: workflow-log
    attributes:
      label: Relevant workflow output
      description: Paste only the relevant error lines. Remove usernames, tokens, or private information.
      render: shell
      placeholder: Paste the relevant GitHub Actions error here.
    validations:
      required: false

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Paste your config.json when relevant. Remove anything private.
      render: json
      placeholder: |
        {
          "output_path": "assets/github-stats.svg",
          "max_languages": 6
        }
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Required only when running the generator locally.
      placeholder: "Example: Python 3.13.5"
    validations:
      required: false

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - GitHub Actions — Ubuntu
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or generated SVG
      description: Drag and drop screenshots here when the problem is visual.
      placeholder: Add screenshots or other useful evidence.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed tokens, secrets, and private information.
          required: true
        - label: I understand that manually editing the generated SVG is not supported.
          required: true
