name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "config.json"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate configuration JSON
        run: python -m json.tool config.json > /dev/null

      - name: Compile Python files
        run: |
          python -m py_compile scripts/generate_stats.py
          python -m py_compile tests/test_generate_stats.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
